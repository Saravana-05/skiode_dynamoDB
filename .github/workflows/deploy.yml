name: Build and Deploy Backend

on:
  push:
    branches:
      - keerthana-dev

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: skiode-backend
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set Docker Username
        run: echo "DOCKERHUB_USER=${{ secrets.DOCKER_USERNAME }}" >> $GITHUB_ENV

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_USER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.DOCKERHUB_USER }}/${{ env.IMAGE_NAME }}:latest

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            IMAGE=${{ env.DOCKERHUB_USER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ENV_FILE=/home/dev/skiode_dynamoDB/.env
            CERT_FILE=/home/dev/skiode_dynamoDB/certs/root.crt

            docker pull "$IMAGE"
            docker rm -f skiode-backend || true
            docker run -d \
              --name skiode-backend \
              -p 8080:8000 \
              --env-file "$ENV_FILE" \
              -v "$CERT_FILE:/certs/root.crt:ro" \
              --restart unless-stopped \
              "$IMAGE"

            docker image prune -f