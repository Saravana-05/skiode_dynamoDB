[calendar_event]

create = """
INSERT INTO calendar_events
(
created_by_id,
title,
description,
start_datetime,
end_datetime,
timezone,
status,
event_type
)
VALUES ($1,$2,$3,$4,$5,$6,$7,$8)
RETURNING id;
"""

get_events = """
SELECT *
FROM calendar_events
WHERE created_by_id = $1
ORDER BY start_datetime DESC;
"""

update_google_event = """
UPDATE calendar_events
SET google_event_id = $2
WHERE id = $1;
"""

update_outlook_event = """
UPDATE calendar_events
SET outlook_event_id = $2
WHERE id = $1;
"""

check_conflict = """
SELECT 1
FROM calendar_events
WHERE created_by_id = $1
AND status = 'SCHEDULED'
AND (
    start_datetime < $3
    AND end_datetime > $2
)
LIMIT 1;
"""

