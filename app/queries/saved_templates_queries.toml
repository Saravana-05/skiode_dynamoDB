[saved_templates]
get_all_saved_templates = """
SELECT st.*, p.name AS project_name
FROM saved_templates st
LEFT JOIN projects p ON p.id = st.project_id
ORDER BY st.updated_at DESC
"""

get_saved_templates_by_project = """
SELECT st.*, p.name AS project_name
FROM saved_templates st
LEFT JOIN projects p ON p.id = st.project_id
WHERE st.project_id = $1
ORDER BY st.updated_at DESC
"""

get_saved_template_by_id = """
SELECT st.*, p.name AS project_name
FROM saved_templates st
LEFT JOIN projects p ON p.id = st.project_id
WHERE st.id = $1
"""

insert_saved_template = """
WITH ins AS (
    INSERT INTO saved_templates (name, plugin_id, instance, created_by, project_id)
    VALUES ($1, $2, $3, $4, $5)
    RETURNING *
)
SELECT ins.*, p.name AS project_name
FROM ins
LEFT JOIN projects p ON p.id = ins.project_id
"""

delete_saved_template = """
DELETE FROM saved_templates
WHERE id = $1
"""

# $5 = new project_id, $6 = whether to change it at all (lets a caller clear the
# project by sending null, while a plain edit that doesn't mention it keeps it).
update_saved_template = """
WITH upd AS (
    UPDATE saved_templates
    SET name       = COALESCE($2, name),
        plugin_id  = COALESCE($3, plugin_id),
        instance   = COALESCE($4::jsonb, instance),
        project_id = CASE WHEN $6::boolean THEN $5::int ELSE project_id END,
        updated_at = NOW()
    WHERE id = $1
    RETURNING *
)
SELECT upd.*, p.name AS project_name
FROM upd
LEFT JOIN projects p ON p.id = upd.project_id
"""